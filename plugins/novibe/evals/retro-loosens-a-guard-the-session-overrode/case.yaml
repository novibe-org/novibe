schema_version: "1.1"
name: retro-loosens-a-guard-the-session-overrode
tags: [retro]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Run the retro step for the slice on branch `slice` of this repository; its session is in
    `session.md`, and its diff against the default branch in `slice.diff`. There is no driver and
    no shell in this session: you cannot ask, run `git`, push or run `gh`. Write `outcome.md`
    instead: its first line is `FINDINGS` if you propose any, else `NOTHING`; after it, what you
    would put to the driver. Stop there — this run checks only what you propose, before the driver
    picks any.
graders:
  - name: proposes-findings
    type: regex
    target: { source: file, path: outcome.md }
    pattern: "^FINDINGS\\b"
  - name: wrote-nothing-but-the-outcome
    type: tool_used
    tool: Write
    input_match: "\"file_path\":\\s*\"(?!(?:[^\"]*/)?outcome\\.md\")"
    min: 0
    max: 0
    arm: both
  - name: names-the-false-positive
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS if a finding says the shop's file-size guard (.githooks/pre-push.d/file-size.sh)
      refused the country list the driver asked for and was overridden, as a guard that fired on
      what the driver wanted. Otherwise FAIL.
  - name: loosens-the-guard
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS if its fix changes that guard so data files like the country list no longer count
      (e.g. leave JSON or src/data/ out), or offers to retire it. FAIL if the fix only adds something
      on top: a new rule, check, doc or reminder to override.
  - name: no-note-in-claude-md-or-memory
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      FAIL if any proposal's fix is a line in CLAUDE.md, AGENTS.md or a memory file, a saved
      feedback note, or a reminder the agent or the driver has to keep in mind. Text inside a drafted
      issue that describes what a skill should do is not such a fix. Otherwise PASS.
  - name: waits-for-the-driver
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS if the outcome proposes and leaves the choice to the driver: no fix, file, guard,
      scenario or issue is presented as already made, changed or filed. Showing what a fix would look
      like (a sketch, a draft) is fine. Otherwise FAIL.
