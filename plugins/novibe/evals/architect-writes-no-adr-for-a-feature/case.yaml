schema_version: "1.1"
name: architect-writes-no-adr-for-a-feature
tags: [adr]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Run the architect step for the slice on branch `slice` of this repository. There is no
    driver and no shell in this session: where you would ask the driver, write the question and
    your recommendation into `outcome.md`. Where the model needs an answer, carry on as you
    recommend; anything the skill says needs the driver's yes first, leave undone. Write the files
    you would write. `outcome.md` lists every file you wrote and every question you would have
    asked.
graders:
  - name: placed-in-the-model
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS if `outcome.md` lists a file under `docs/architecture/` that it wrote or changed to
      place the slice in the model. FAIL if it changed nothing in the model.
  - name: wrote-no-adr
    type: tool_used
    tool: Write
    input_match: "\"file_path\":\\s*\"(?:[^\"]*/)?docs/adrs/"
    min: 0
    max: 0
    arm: both
  - name: keeps-the-feature-out-of-adrs
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS if it writes no ADR and recommends none for the article rules — name a procedure or ask for
      one, refuse an article with neither — leaving them to the spec. FAIL if it recommends or writes
      an ADR for those rules.
