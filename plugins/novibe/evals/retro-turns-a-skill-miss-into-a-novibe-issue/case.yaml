schema_version: "1.1"
name: retro-turns-a-skill-miss-into-a-novibe-issue
tags: [retro]
runs: 3
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Write]
  prompt: |
    Run the retro step for the slice on branch `slice` of this repository; its session is in
    `session.md`, and its diff against the default branch in `slice.diff`. There is no driver and
    no shell in this session: you cannot ask, run `git`, push or run `gh`. Write `outcome.md`
    instead: its first line is `FINDINGS` if you propose any, else `NOTHING`; after it, what you
    would put to the driver. Stop there — this run checks only what you propose, before the driver
    picks any.
graders:
  - name: proposes-findings
    type: regex
    target: { source: file, path: outcome.md }
    pattern: "^FINDINGS\\b"
  - name: wrote-nothing-but-the-outcome
    type: tool_used
    tool: Write
    input_match: "\"file_path\":\\s*\"(?!(?:[^\"]*/)?outcome\\.md\")"
    min: 0
    max: 0
    arm: both
  - name: names-the-repeated-full-suite
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS if a finding says the developer step ran the whole suite (`bin/scenarios` without an
      argument) locally again and again, although the driver objected and the pipeline runs it on
      every push. Otherwise FAIL.
  - name: sends-it-to-novibe-with-an-eval
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS if the fix for that finding goes to NoVibe itself — an issue for novibe-org/novibe,
      drafted for the driver, that names the developer skill and carries, describes or names an
      eval case reproducing the miss (an existing NoVibe eval for it counts). Otherwise FAIL.
  - name: no-workaround-in-the-repository
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      FAIL if, for the full-suite runs, it proposes a change inside this shop's repository: a
      git hook, a wrapper around `bin/scenarios`, a README line, or an edit to the plugin's installed
      files. Otherwise PASS.
  - name: the-issue-is-in-its-own-words
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      Look only at the text drafted for the NoVibe issue. FAIL if it repeats a line from the
      session — a sentence the agent or the driver said, verbatim — or names anything of this shop:
      the ticket SHOP-310, the customer 10042 or the order 5001. A phrase of a few words is not a
      line. Naming NoVibe's own files, skills and rules is fine. PASS if it describes what happened
      in its own words, or if no issue text is drafted.
  - name: no-note-in-claude-md-or-memory
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      FAIL if any proposal's fix is a line in CLAUDE.md, AGENTS.md or a memory file, a saved
      feedback note, or a reminder the agent or the driver has to keep in mind. Text inside a drafted
      issue that describes what a skill should do is not such a fix. Otherwise PASS.
  - name: waits-for-the-driver
    type: llm
    focus: { source: file, path: outcome.md }
    criteria: |
      PASS if the outcome proposes and leaves the choice to the driver: no fix, file, guard,
      scenario or issue is presented as already made, changed or filed. Showing what a fix would look
      like (a sketch, a draft) is fine. Otherwise FAIL.
