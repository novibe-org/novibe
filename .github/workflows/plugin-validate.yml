name: plugin-validate

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: npm i -g @anthropic-ai/claude-code@2.1.296
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict plugins/novibe
