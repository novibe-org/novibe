name: LikeC4 architecture diff
description: Comment on a pull request with each view of the LikeC4 model it changed, the changes colour-coded in Mermaid.
author: novibe-org

inputs:
  path:
    description: Directory with the LikeC4 model
    default: docs/architecture
  likec4-version:
    description: Version of the likec4 package to run
    default: 1.60.0
  github-token:
    description: Token that comments on the pull request
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Render the changed views of the base and the pull request
      shell: bash
      env:
        MODEL_DIR: ${{ inputs.path }}
        LIKEC4_VERSION: ${{ inputs.likec4-version }}
        BASE: ${{ github.event.pull_request.base.sha }}
        HEAD: ${{ github.sha }}
      run: |
        set -euo pipefail
        out=$RUNNER_TEMP/architecture-diff
        rm -rf "$out"
        for side in base head; do
          if [ "$side" = base ]; then sha=$BASE; else sha=$HEAD; fi
          git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha"
          mkdir -p "$out/$side/src"
          git cat-file -e "$sha:$MODEL_DIR" 2>/dev/null || continue
          git archive "$sha" "$MODEL_DIR" | tar -x -C "$out/$side/src"
          npx -y "likec4@$LIKEC4_VERSION" export json --skip-layout -o "$out/$side/model.json" "$out/$side/src/$MODEL_DIR"
          npx -y "likec4@$LIKEC4_VERSION" gen mermaid --no-use-dot -o "$out/$side/mermaid" "$out/$side/src/$MODEL_DIR"
        done
        node "$GITHUB_ACTION_PATH/architecture-diff.mjs" "$out/base" "$out/head" >"$out/comment.md"
        cat "$out/comment.md" >>"$GITHUB_STEP_SUMMARY"

    - name: Post or update the pull request comment
      if: github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        comment=$RUNNER_TEMP/architecture-diff/comment.md
        author=$(gh api user -q .login 2>/dev/null) || author='github-actions[bot]'
        id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q ".[]
          | select(.user.login == \"$author\" and (.body | startswith(\"<!-- architecture-diff -->\"))) | .id" | head -n 1)
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$comment" >/dev/null
        elif ! grep -q '^No view of the architecture model changed' "$comment"; then
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$comment"
        fi
